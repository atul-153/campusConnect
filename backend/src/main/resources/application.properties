spring.application.name=campusconnect-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campusconnect?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:campusconnect}
spring.datasource.password=${DB_PASSWORD:campusconnect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-to-a-long-random-value-32chars}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:12}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
